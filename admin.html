<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Administración | Vallenateando Radio</title>
<link rel="icon" href="https://i.ibb.co/fd1KBpkp/IMG-20260917-WA0016-removebg-preview.png">
<link rel="stylesheet" href="styles.css">
<style>
.admin-page{background:#f7f4fa;min-height:100vh;padding:40px 0 80px}.admin-box{background:#fff;border:1px solid #e9e2ef;border-radius:22px;padding:28px;box-shadow:0 15px 40px rgba(50,25,70,.08);margin-bottom:22px}.admin-box h2{margin-bottom:18px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.form-grid .full{grid-column:1/-1}.admin-box input,.admin-box textarea,.admin-box select{width:100%;padding:12px;border:1px solid #ddd3e4;border-radius:11px;background:#fff}.admin-box textarea{min-height:120px;resize:vertical}.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.admin-btn{border:0;border-radius:999px;padding:12px 18px;background:#7c20c8;color:#fff;font-weight:800;cursor:pointer}.admin-btn.secondary{background:#eee7f2;color:#54216d}.admin-list{display:grid;gap:10px}.admin-row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:15px;border:1px solid #e9e2ef;border-radius:14px}.hidden{display:none}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.admin-row{align-items:flex-start;flex-direction:column}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<header class="main-header"><div class="header-container"><a href="index.html" class="brand"><img class="brand-logo" src="https://i.ibb.co/fd1KBpkp/IMG-20260917-WA0016-removebg-preview.png" alt="Vallenateando Radio"></a><a class="login-link" href="index.html">← Volver al sitio</a></div></header>
<main class="admin-page"><div class="section-container">
<div id="loginBox" class="admin-box">
<h1>Panel administrativo</h1><p>Inicia sesión para administrar Vallenateando Radio.</p>
<form id="loginForm" class="form-grid" style="margin-top:18px"><input id="email" type="email" placeholder="Correo" required><input id="password" type="password" placeholder="Contraseña" required><div class="full admin-actions"><button class="admin-btn" type="submit">Iniciar sesión</button></div></form><p id="loginMsg"></p>
</div>
<div id="panel" class="hidden">
<div class="admin-box"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap"><div><h1>Administración</h1><p>Noticias, programación y publicidad.</p></div><button id="logout" class="admin-btn secondary">Cerrar sesión</button></div></div>
<div class="admin-box"><h2>Programación</h2><form id="programForm" class="form-grid"><input type="date" id="pFecha" required><input type="text" id="pTitulo" placeholder="Nombre del programa" required><input type="time" id="pInicio" required><input type="time" id="pFin" required><textarea id="pDesc" class="full" placeholder="Descripción"></textarea><div class="full admin-actions"><button class="admin-btn">Guardar programa</button></div></form><div id="programList" class="admin-list"></div></div>
<div class="admin-box"><h2>Noticias</h2><form id="newsForm" class="form-grid"><input type="text" id="nTitulo" placeholder="Título" required><input type="text" id="nCategoria" placeholder="Categoría"><input type="url" id="nImagen" placeholder="URL de imagen"><textarea id="nResumen" class="full" placeholder="Resumen"></textarea><textarea id="nContenido" class="full" placeholder="Contenido de la noticia"></textarea><input type="url" id="nVideo" class="full" placeholder="URL de video (opcional)"><div class="full admin-actions"><button class="admin-btn">Publicar noticia</button></div></form><div id="newsList" class="admin-list"></div></div>
<div class="admin-box"><h2>Publicidad</h2><form id="adForm" class="form-grid"><input type="text" id="aTitulo" placeholder="Título" required><input type="url" id="aImagen" placeholder="URL de imagen"><textarea id="aDesc" class="full" placeholder="Descripción"></textarea><div class="full admin-actions"><button class="admin-btn">Publicar publicidad</button></div></form><div id="adList" class="admin-list"></div></div>
</div></div></main>
<script src="supabase.js"></script><script src="admin.js"></script>
</body></html>
